[graph]
all-features = false

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, not vulnerable; used only for local session snapshots" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, not vulnerable; comes in through cosmic-text" },
]
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
